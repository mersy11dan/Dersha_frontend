<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" fill="none" role="img" aria-label="DERSHA">
  <defs>
    <linearGradient id="m-own" x1="26" y1="8" x2="40" y2="24" gradientUnits="userSpaceOnUse">
      <stop stop-color="#85f8c4"/>
      <stop offset="1" stop-color="#059669"/>
    </linearGradient>
  </defs>

  <!-- The whole asset, divided into tradable units -->
  <g fill="none" stroke-width="5.5" stroke-linecap="round">
    <path d="M38.89 25.83A15 15 0 0 1 25.83 38.89" stroke="#059669" stroke-opacity="0.32"/>
    <path d="M22.17 38.89A15 15 0 0 1 9.11 25.83" stroke="#059669" stroke-opacity="0.32"/>
    <path d="M9.11 22.17A15 15 0 0 1 22.17 9.11" stroke="#059669" stroke-opacity="0.32"/>

    <!-- The unit you own, lifted out of the whole -->
    <path d="M25.83 9.11A15 15 0 0 1 38.89 22.17" stroke="url(#m-own)" transform="translate(1.7 -1.7)"/>
  </g>

  <!-- Yield compounding across holdings -->
  <g>
    <rect x="16.8" y="24.5" width="3.2" height="6" rx="1.6" fill="#059669" fill-opacity="0.65"/>
    <rect x="22.4" y="21" width="3.2" height="9.5" rx="1.6" fill="#68dba9"/>
    <rect x="28" y="17.5" width="3.2" height="13" rx="1.6" fill="#85f8c4"/>
  </g>
</svg>
